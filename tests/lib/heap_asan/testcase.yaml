  filter: >
    CONFIG_QEMU_TARGET and
    (CONFIG_RISCV or CONFIG_ARM or CONFIG_ARM64 or CONFIG_X86 or
     CONFIG_MIPS or CONFIG_XTENSA or CONFIG_SPARC)
